[project]
name = "evm-intervene"
version = "0.1.0"
description = "Counterfactual intervention benchmark for financial world models via deterministic EVM liquidity cliffs and liquidation cascades"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
models = [
    "torch>=2.4,<3",
]

[build-system]
requires = ["uv_build>=0.9,<0.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv.build-backend]
module-name = "evm_intervene"
module-root = "src"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E741"]
